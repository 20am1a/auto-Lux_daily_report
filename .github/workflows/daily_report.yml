name: Auto Lux Daily WhatsApp Report

on:
  schedule:
    # Runs at 6:30 PM IST (13:00 UTC) every day
    - cron: '0 13 * * 1-6'
  workflow_dispatch: # Allows manual 1-click trigger button in GitHub UI

jobs:
  send-whatsapp-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pymysql matplotlib

      - name: Run Daily Report Generator
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: |
          python run_report.py
